name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -c "import pandas, openpyxl"
      - run: python -m unittest discover -s tests -v
      - run: python -m datenfutter layout
      - run: python projects/unemployment-de-ch-dk-no/verify.py
      - run: git diff --exit-code
